[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oasis"
version = "1.0.0"
description = "Focused OASIS Platform"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
authors = [
  { name = "Wallace Huang Jiajun" }
]
maintainers = [
  { name = "SunShineHead" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "flake8", "black", "isort"]

[project.scripts]
oasis = "oasis.cli:main"
